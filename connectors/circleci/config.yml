# EvidencePlane CircleCI integration
# Add the evidenceplane job to your .circleci/config.yml.
#
# Required (set in CircleCI project settings or context):
#   EVIDENCEPLANE_URL         — your EvidencePlane instance URL
#   EVIDENCEPLANE_HMAC_SECRET — signing secret
#
# Optional:
#   EVIDENCEPLANE_SOURCE_ID   — UUID from POST /api/v1/sources

version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Run tests
          command: python -m pytest --junitxml=report.xml
      - store_test_results:
          path: report.xml
      - store_artifacts:
          path: report.xml
          destination: test-results/report.xml
      - persist_to_workspace:
          root: .
          paths: [report.xml]

  evidenceplane:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Submit to EvidencePlane
          command: python connectors/circleci/connector.py
          environment:
            EP_TEST_REPORT_XML: report.xml
            # EVIDENCEPLANE_DRY_RUN: "1"  # uncomment to preview

workflows:
  build-and-govern:
    jobs:
      - test
      - evidenceplane:
          requires: [test]
          context: evidenceplane-secrets
