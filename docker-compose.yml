services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: evidenceplane
      POSTGRES_USER: evidenceplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - evidenceplane-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidenceplane -d evidenceplane"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://evidenceplane:${POSTGRES_PASSWORD}@db:5432/evidenceplane
      EVIDENCEPLANE_HMAC_SECRET: ${EVIDENCEPLANE_HMAC_SECRET:?set EVIDENCEPLANE_HMAC_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  evidenceplane-db:
